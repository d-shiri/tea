# A dashboard for tea, ready to paste -- or to push:
#
#   ./dist/home-assistant/push.py dashboard sensor.phone_daily_steps=sensor.<yours>_daily_steps
#
# By hand: Settings → Dashboards → Add dashboard → "New dashboard from scratch",
# open it, pencil → ⋮ → "Raw configuration editor", paste, save.
#
# Needs `publish = "on"` under [nfc.home_assistant] in tea's config. The tea
# entities are named after `publish_entity`; with the default "sensor.tea" they
# are the ones below. Two entities are yours to fill in. One is the
# phone's own daily step count, from the companion app -- what "steps today,
# all of them" is measured against. The other is the to-do list the break page
# reads, `todo.household` here:
#
#   ./dist/home-assistant/push.py dashboard \
#       sensor.phone_daily_steps=sensor.<yours>_daily_steps \
#       todo.household=todo.<yours>
#
# Six numbers and three pictures, on purpose. Each picture has one axis and one
# kind of thing on it: steps against steps, breaks against days, jobs against
# days. The list itself is the one card here you can act on.
title: tea
views:
  - title: tea
    path: tea
    icon: mdi:tea
    cards:
      # Today, in numbers.
      - type: horizontal-stack
        cards:
          - type: tile
            entity: sensor.tea_breaks_today
            name: Breaks today
            icon: mdi:coffee
            color: teal
          - type: tile
            entity: sensor.tea_steps_today
            name: Steps in breaks
            icon: mdi:walk
            color: green
          - type: tile
            entity: sensor.phone_daily_steps
            name: Steps today, all of them
            icon: mdi:shoe-print
            color: grey
          - type: tile
            entity: sensor.tea_chores_today
            name: Jobs done in breaks
            icon: mdi:clipboard-check-outline
            color: green
          - type: tile
            entity: sensor.tea_worked_today
            name: Worked today
            icon: mdi:briefcase-clock
            color: blue

      # Walking today: the steps taken in breaks, against all the steps the
      # phone counted. Two rising lines, one axis, one unit.
      - type: history-graph
        title: Walking today
        hours_to_show: 16
        entities:
          - entity: sensor.phone_daily_steps
            name: All steps
          - entity: sensor.tea_steps_today
            name: In breaks

      # Breaks, one bar a day, a month back.
      - type: statistics-graph
        title: Breaks per day
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - change
        entities:
          - entity: sensor.tea_breaks_today
            name: Breaks

      # The list the break page reads, live and tickable from here. tea only
      # ever reads it: this card is the other end of that, and the tile beside
      # it is the entity's own state -- how many jobs are still open.
      - type: horizontal-stack
        cards:
          - type: tile
            entity: todo.household
            name: Still on the list
            icon: mdi:format-list-checks
            color: amber
          - type: tile
            entity: sensor.tea_chores_today
            name: Done in breaks today
            icon: mdi:clipboard-check-outline
            color: green
      - type: todo-list
        entity: todo.household

      # Jobs ticked off the to-do list during breaks, one bar a day. The same
      # shape as the breaks above on purpose: a break taken and a job done are
      # the two halves of the same question -- whether any of this is working.
      - type: statistics-graph
        title: Jobs done per day
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - change
        entities:
          - entity: sensor.tea_chores_today
            name: Jobs

      # And the same numbers added up since tea started reporting.
      - type: horizontal-stack
        cards:
          - type: statistic
            entity: sensor.tea_breaks_today
            name: Breaks, all time
            stat_type: change
            period:
              rolling_window:
                duration:
                  days: 365
          - type: statistic
            entity: sensor.tea_steps_today
            name: Steps in breaks, all time
            stat_type: change
            period:
              rolling_window:
                duration:
                  days: 365
          - type: statistic
            entity: sensor.tea_chores_today
            name: Jobs done, all time
            stat_type: change
            period:
              rolling_window:
                duration:
                  days: 365
          - type: statistic
            entity: sensor.tea_worked_today
            name: Worked, all time
            stat_type: change
            period:
              rolling_window:
                duration:
                  days: 365
