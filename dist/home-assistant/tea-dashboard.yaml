# A dashboard for tea, ready to paste -- or to push:
#
#   ./dist/home-assistant/push.py dashboard sensor.phone_daily_steps=sensor.<yours>_daily_steps
#
# By hand: Settings → Dashboards → Add dashboard → "New dashboard from scratch",
# open it, pencil → ⋮ → "Raw configuration editor", paste, save.
#
# Needs `publish = "on"` under [nfc.home_assistant] in tea's config. The tea
# entities are named after `publish_entity`; with the default "sensor.tea" they
# are the ones below. Two entities are yours to fill in. One is the
# phone's own daily step count, from the companion app -- what "steps today,
# all of them" is measured against. The other is the to-do list the break page
# reads, `todo.household` here:
#
#   ./dist/home-assistant/push.py dashboard \
#       sensor.phone_daily_steps=sensor.<yours>_daily_steps \
#       todo.household=todo.<yours>
#
# Four numbers and three pictures, on purpose. Each picture has one axis and one
# kind of thing on it: steps against steps, breaks against days, tasks against
# days. The list itself is the one card here you can act on.
title: tea
views:
  - title: tea
    path: tea
    icon: mdi:tea
    cards:
      # Today, in numbers. Two to a row: more than that and the names get
      # cut short. The steps in breaks are not here, they are the green line
      # in the picture below.
      - type: horizontal-stack
        cards:
          - type: tile
            entity: sensor.tea_breaks_today
            name: Breaks today
            icon: mdi:coffee
            color: teal
          - type: tile
            entity: sensor.phone_daily_steps
            name: Steps today
            icon: mdi:shoe-print
            color: grey

      # Walking today: the steps taken in breaks, against all the steps the
      # phone counted. Two rising lines, one axis, one unit. Ten hours, not
      # more: further back is yesterday's count falling off a cliff at
      # midnight, which is not a thing that happened today.
      - type: history-graph
        title: Walking today
        hours_to_show: 10
        entities:
          - entity: sensor.phone_daily_steps
            name: All steps
          - entity: sensor.tea_steps_today
            name: In breaks

      # Breaks, one bar a day, a month back.
      - type: statistics-graph
        title: Breaks per day
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - change
        entities:
          - entity: sensor.tea_breaks_today
            name: Breaks

      # The list the break page reads, live and tickable from here. tea only
      # ever reads it: this card is the other end of that, and the tile beside
      # it is the entity's own state -- how many tasks are still open.
      - type: horizontal-stack
        cards:
          - type: tile
            entity: todo.household
            name: Tasks left
            icon: mdi:format-list-checks
            color: amber
          - type: tile
            entity: sensor.tea_chores_today
            name: Tasks done in breaks today
            icon: mdi:clipboard-check-outline
            color: green
      - type: todo-list
        entity: todo.household

      # Tasks ticked off the to-do list during breaks, one bar a day. The same
      # shape as the breaks above on purpose: a break taken and a task done are
      # the two halves of the same question -- whether any of this is working.
      - type: statistics-graph
        title: Tasks done per day
        chart_type: bar
        period: day
        days_to_show: 30
        stat_types:
          - change
        entities:
          - entity: sensor.tea_chores_today
            name: Tasks
        # One series: a legend saying "Tasks (change)" explains nothing.
        hide_legend: true

      # And the same numbers added up since tea started reporting. The
      # heading says "all time" once, so the cards can have short names
      # that fit two to a row.
      - type: heading
        heading: Since the start
        heading_style: subtitle
        icon: mdi:calendar-clock
      - type: horizontal-stack
        cards:
          - type: statistic
            entity: sensor.tea_breaks_today
            name: Breaks
            stat_type: change
            period:
              rolling_window:
                duration:
                  days: 365
          - type: statistic
            entity: sensor.tea_steps_today
            name: Steps in breaks
            stat_type: change
            period:
              rolling_window:
                duration:
                  days: 365
      - type: horizontal-stack
        cards:
          # Not tea's sensor but the list's own count of everything ticked
          # off, kept by the tea_tasks_done automation: the list remembers
          # from before tea began reporting. A tile rather than a statistic
          # because it is a number the hub already holds, not one to add up.
          - type: tile
            entity: input_number.tea_tasks_done
            name: Tasks done
            icon: mdi:clipboard-check-multiple-outline
            color: green
            tap_action:
              action: none
          # Minutes and hours both, `1,020 min (17.0 h)`: a statistic card can
          # only show a bare number, so this reads a template sensor over a
          # utility meter that adds the daily counter up across its midnight
          # resets. `push.py dashboard` makes both helpers and seeds the meter
          # from the recorder, so the total starts where the old card was.
          - type: tile
            entity: sensor.tea_worked_since_start
            name: Worked
            icon: mdi:briefcase-clock
            color: purple
            tap_action:
              action: none
