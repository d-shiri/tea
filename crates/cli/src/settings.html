<style>
  html { color-scheme: dark }
  body {
    margin: 0; padding: 0 1rem 5rem; background: #0d1017; color: #e6e9f0;
    font: 400 13.5px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 2; background: #0d1017; border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; gap: .8rem; padding: .7rem 0; margin-bottom: .6rem;
  }
  header img { width: 32px; height: 32px }
  header h1 { font: 300 1.3rem/1 system-ui, sans-serif; margin: 0 }
  header p { margin: 0; color: #626d86; font-size: .8rem }
  #hub {
    margin-left: auto; display: inline-flex; align-items: center; gap: .4rem; color: #9aa5bd; text-decoration: none;
    font-size: .85rem; padding: .35rem .7rem; border: 1px solid rgba(255,255,255,.1); border-radius: 2rem; white-space: nowrap;
  }
  #hub:hover { color: #eef1f7; border-color: rgba(255,255,255,.25) }
  #hub .ha { margin: 0; opacity: .8 }
  #q { width: min(18rem, 45vw); background: #171d2c; color: #eef1f7; border: 1px solid rgba(255,255,255,.1);
    border-radius: 2rem; padding: .4rem .9rem; font: inherit;
  }
  #q:focus { outline: none; border-color: #7aa2ff }
  main { max-width: 84rem; margin: 0 auto }
  .cols { columns: 1; column-gap: 2.5rem }
  @media (min-width: 60rem) { .cols { columns: 2 } }
  hr { border: 0; border-top: 1px solid rgba(255,255,255,.14); margin: 1.4rem 0 1rem }
  h2.big { font-size: .9rem; letter-spacing: .1em; color: #b8c0d2; border: 0; margin-bottom: .6rem }
  section { break-inside: avoid; margin-bottom: 1rem }
  h2 {
    font: 500 .72rem/1 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase;
    color: #79839c; margin: 0 0 .3rem; padding-bottom: .3rem; border-bottom: 1px solid rgba(255,255,255,.08);
  }
  label { display: grid; grid-template-columns: 7.5rem 11rem 1fr; gap: .6rem; align-items: center; padding: .15rem 0 }
  label > span { color: #b8c0d2; font: .85rem ui-monospace, "DejaVu Sans Mono", monospace; overflow: hidden; text-overflow: ellipsis }
  label > small { color: #626d86; font-size: .76rem; line-height: 1.25 }
  label > div:empty { display: none }
  #common label { grid-template-columns: 9.5rem 11rem 1fr }
  input, select {
    box-sizing: border-box; width: 100%; background: #171d2c; color: #eef1f7; border: 1px solid rgba(255,255,255,.1);
    border-radius: .35rem; padding: .25rem .5rem; font: .85rem ui-monospace, "DejaVu Sans Mono", monospace;
  }
  input:focus, select:focus { outline: none; border-color: #7aa2ff }
  .changed { border-color: #c98500 }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; background: #0d1017; border-top: 1px solid rgba(255,255,255,.08);
    padding: .6rem 1rem; display: flex; gap: .6rem; align-items: center; flex-wrap: wrap;
  }
  button {
    background: #171d2c; color: #b8c0d2; border: 1px solid rgba(255,255,255,.1); border-radius: .45rem;
    padding: .45rem 1rem; font: 500 .9rem system-ui, sans-serif; cursor: pointer;
  }
  #save { background: #7aa2ff; color: #0d1017; border-color: transparent }
  #apply { background: #4ade80; color: #0d1017; border-color: transparent }
  button:disabled { opacity: .4; cursor: default }
  #note { color: #79839c; white-space: pre-wrap; font: .8rem ui-monospace, monospace; flex: 1 1 12rem }
  #note.bad { color: #ff8a80 }
  #note.good { color: #4ade80 }
  .warn {
    grid-column: 1 / -1; margin: .2rem 0 .4rem; padding: .5rem .7rem; border: 1px solid #c98500; border-radius: .4rem;
    background: rgba(201,133,0,.08); color: #e6c98a; font-size: .8rem; line-height: 1.35;
  }
  .warn button { margin: .4rem .4rem 0 0; padding: .25rem .7rem; font-size: .8rem }
  .warn .sure { background: #c98500; color: #0d1017; border-color: transparent }
  .ha { display: inline-block; width: 13px; height: 13px; margin-left: .4rem; vertical-align: -2px; opacity: .55 }
  h2 .ha { vertical-align: -3px }
  [hidden] { display: none !important }
  @media (max-width: 40rem) { label { grid-template-columns: 1fr 1fr } label > small { grid-column: 1 / -1 } }
</style>
</head>

    <div><h1>tea</h1><p>Save writes the file. Apply restarts tea with it.</p></div>
    <a id="hub" href="#" target="_blank" rel="noopener" hidden>Home Assistant</a>
    <input id="q" type="search" placeholder="Search settings…" autocomplete="off" spellcheck="false">
  </header>
  <form id="f"></form>
</main>
<footer>
  <button id="save" form="f" disabled>Save</button>
  <button id="apply" type="button" hidden>Apply changes</button>
  <button id="undo" type="button">Reload from disk</button>
  <div id="note"></div>
</footer>
<script>
(() => {
  // The token arrives once, in the address bar, and is taken out of it again
  // so it is not left in the history. Every request after that carries it as
  // a header, which is what stops any other page open in this browser from
  // saving a config of its own here.
  const token = new URLSearchParams(location.search).get('token') || '';
  history.replaceState(null, '', location.pathname);
  const auth = { 'X-Tea-Token': token };

  const form = document.getElementById('f');
  const note = document.getElementById('note');
  const save = document.getElementById('save');
  const apply = document.getElementById('apply');
  const q = document.getElementById('q');
  let lines = [];    // the file, one entry per line, exactly as read
  let fields = [];   // the lines that are `key = value`, with their inputs
  let sections = []; // {el, rows}
  let top = [];      // the common block, the rule and the heading under it
  // What goes in the common block, in this order: the things that get
  // changed week to week rather than once.
  const COMMON = ['work', 'break', 'warn_before', 'idle.credit', 'idle.pause', 'postpone.budget', 'hold.mode',
    'nfc.mode', 'nfc.steps.mode', 'nfc.steps.count', 'nfc.chores.mode', 'nfc.chores.show'];
  let pending = false; // saved, but the daemon is still running the old file

  const el = (tag, text) => { const e = document.createElement(tag); if (text != null) e.textContent = text; return e; };
  // The Home Assistant mark, drawn small and grey: a house with the node
  // tree cut out of it. Put beside anything read from the hub, so the rows
  // that need it to be reachable can be told from the rows that do not.
  const HA = '<svg class="ha" viewBox="0 0 24 24" aria-label="Home Assistant"><path fill="#6b7590" d="M12 2.5 21.5 11.7V21.5H2.5V11.7Z"/>'
    + '<g stroke="#0d1017" stroke-width="1.5" fill="none"><path d="M12 21.5V9.5M12 14.2 7.6 10M12 16.5l4.4-4.2"/></g>'
    + '<g fill="#0d1017"><circle cx="12" cy="8.6" r="1.7"/><circle cx="7" cy="9.4" r="1.5"/><circle cx="17" cy="11.6" r="1.5"/></g></svg>';
  const fromHub = (section, key) => section === 'nfc.home_assistant' || key === 'entity';
  // Settings with a fixed handful of answers get a box to pick from.
  const CHOICES = {
    'hold.mode': ['soft', 'insist', 'strict'],
    'sound.mode': ['chime', 'voice', 'both', 'off'],
    'page.background': ['dark', 'dim'],
    'nfc.steps.sync': ['live', 'batched'],
  };
  // Strict takes the Super key away for every break. Chosen on purpose or
  // not at all: the page will not save it until this has been answered.
  let unsure = false;
  const say = (text, tone) => { note.textContent = text; note.className = tone || ''; };
  const dirty = () => fields.some(f => f.input.value !== f.shown);
  // Two inputs for one line: whichever is typed in, the other follows.
  function twin(a, b, shown) {
    const follow = (from, to) => from.addEventListener('input', () => {
      to.value = from.value;
      for (const i of [from, to]) i.classList.toggle('changed', i.value !== shown);
      buttons();
    });
    follow(a, b);
    follow(b, a);
  }
  function buttons() {
    save.disabled = !dirty() || unsure;
    apply.hidden = !(dirty() || pending);
    apply.disabled = unsure;
  }

  // Where the value ends and the comment starts, minding quotes: `"#7aa2ff"`
  // is a colour, not a remark.
  function split(rest) {
    let quote = null;
    for (let i = 0; i < rest.length; i++) {
      const c = rest[i];
      if (quote) { if (c === '\\' && quote === '"') i++; else if (c === quote) quote = null; }
      else if (c === '"' || c === "'") quote = c;
      else if (c === '#') return [rest.slice(0, i), rest.slice(i)];
    }
    return [rest, ''];
  }
  const unquote = s => s.replace(/\\(["\\])/g, '$1');
  const quote = s => '"' + s.replace(/["\\]/g, '\\$&') + '"';

  function render(text) {
    lines = text.split('\n');
    fields = [];
    sections = [];
    form.textContent = '';
    const common = el('div'); common.className = 'cols'; common.id = 'common';
    const all = el('div'); all.className = 'cols';
    const rule = el('hr');
    const heading = el('h2', 'All settings'); heading.className = 'big';
    const commonHead = el('h2', 'Common'); commonHead.className = 'big';
    top = [commonHead, common, rule, heading];
    form.append(commonHead, common, rule, heading, all);
    const picks = new Map();
    let section = null;
    const open = name => {
      section = { el: el('section'), name, rows: [] };
      const h = el('h2', name);
      if (fromHub(name, '')) h.insertAdjacentHTML('beforeend', HA);
      section.el.append(h);
      all.append(section.el);
      sections.push(section);
    };
    const make = (key, shown, str, name) => {
      const choices = str && (CHOICES[name + '.' + key] || (/^(on|off)$/.test(shown) ? ['on', 'off'] : null));
      let input;
      if (choices) {
        input = el('select');
        if (!choices.includes(shown)) choices.unshift(shown);
        for (const o of choices) { const op = el('option', o); op.value = o; input.append(op); }
      } else {
        input = el('input');
        input.spellcheck = false;
      }
      input.value = shown;
      return input;
    };
    const row = (key, input, help, name) => {
      const r = el('label');
      const n = el('span', key);
      if (fromHub(name, key) && name !== 'nfc.home_assistant') n.insertAdjacentHTML('beforeend', HA);
      r.append(n, input, el('small', help));
      return r;
    };
    lines.forEach((line, i) => {
      let m = line.match(/^\s*\[([^\]]+)\]\s*(#.*)?$/);
      if (m) { open(m[1]); return; }
      m = line.match(/^(\s*[A-Za-z0-9_.-]+\s*=\s*)(.*)$/);
      if (!m) return;
      if (!section) open('general');
      const [value, comment] = split(m[2]);
      const raw = value.trim();
      const str = /^"(.*)"$/.exec(raw);
      const shown = str ? unquote(str[1]) : raw;
      const key = m[1].replace(/\s*=\s*$/, '').trim();
      const help = comment.replace(/^#\s?/, '');
      const input = make(key, shown, str, section.name);
      input.title = help;
      input.addEventListener('input', () => { input.classList.toggle('changed', input.value !== shown); buttons(); });
      const r = row(key, input, help, section.name);
      section.el.append(r);
      if (section.name === 'hold' && key === 'mode') strictGuard(input, section.el, shown);
      section.rows.push({ row: r, text: (section.name + ' ' + key + ' ' + help).toLowerCase() });
      // The common block gets a second copy of the row, kept in step with
      // this one, so a change in either place is the same change.
      const full = (section.name === 'general' ? '' : section.name + '.') + key;
      if (COMMON.includes(full)) {
        const other = make(key, shown, str, section.name);
        other.title = help;
        twin(input, other, shown);
        const r2 = row(full, other, help, section.name);
        if (full === 'hold.mode') { const box = el('div'); r2.append(box); strictGuard(other, r2, shown, box); }
        picks.set(full, r2);
      }
      // Everything needed to put the line back together with only the value
      // swapped: the comment stays in its column when the new value fits.
      fields.push({ i, key: full, lead: m[1], raw, string: !!str, shown, column: m[1].length + value.length, comment, input });
    });
    for (const name of COMMON) if (picks.has(name)) common.append(picks.get(name));
    hubLink();
    if (!picks.size) for (const e of top) e.hidden = true;
    if (!fields.length) say('nothing here looks like a setting', 'bad');
    search();
    buttons();
  }

  // The warning under hold.mode, shown the moment "strict" is picked, and
  // gone again when it is confirmed or undone. Inline, not a dialog: it sits
  // beside the thing it is about, and nothing else on the page is blocked.
  function strictGuard(input, holder, was, slot) {
    let box = null;
    let previous = was;
    const clear = () => { if (box) { box.remove(); box = null; } unsure = false; buttons(); };
    input.addEventListener('change', () => {
      if (input.value !== 'strict' || was === 'strict') { previous = input.value; clear(); return; }
      if (box) return;
      unsure = true;
      box = el('div');
      box.className = 'warn';
      box.append(el('span', 'Strict switches your Super key, the overview, Alt-Tab, the workspace keys and the dock keys off '
        + 'for the whole of every break, and puts them back when the page comes down. Only the console and the power button are left. '
        + 'GNOME only: on any other desktop this is the same as insist. Are you sure?'));
      box.append(el('br'));
      const sure = el('button', 'Yes, strict'); sure.type = 'button'; sure.className = 'sure';
      const undo = el('button', 'No, undo'); undo.type = 'button';
      sure.addEventListener('click', () => { previous = 'strict'; clear(); });
      undo.addEventListener('click', () => { input.value = previous; input.dispatchEvent(new Event('input')); clear(); });
      box.append(sure, undo);
      if (slot) slot.append(box); else holder.insertBefore(box, input.parentNode.nextSibling);
      buttons();
    });
  }

  // The hub, one click away, from the same line the daemon reads. Follows
  // the field as it is typed, so a changed address is a changed link.
  function hubLink() {
    const hub = document.getElementById('hub');
    const field = fields.find(f => f.key === 'nfc.home_assistant.url');
    const set = () => {
      const url = field ? field.input.value.trim() : '';
      hub.hidden = !/^https?:\/\//.test(url);
      hub.href = url;
    };
    if (field) field.input.addEventListener('input', set);
    if (!hub.children.length) hub.insertAdjacentHTML('afterbegin', HA);
    set();
  }

  function search() {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    // Searching shows each row once, in its own section.
    for (const e of top) e.hidden = words.length > 0;
    for (const s of sections) {
      let shown = 0;
      for (const r of s.rows) {
        const hit = words.every(w => r.text.includes(w));
        r.row.hidden = !hit;
        if (hit) shown++;
      }
      s.el.hidden = shown === 0;
    }
  }
  q.addEventListener('input', search);

  function compose() {
    const out = lines.slice();
    for (const f of fields) {
      const v = f.input.value;
      if (v === f.shown) continue;
      const value = f.string ? quote(v) : v.trim();
      const pad = f.comment ? ' '.repeat(Math.max(1, f.column - f.lead.length - value.length)) : '';
      out[f.i] = f.lead + value + pad + f.comment;
    }
    return out.join('\n');
  }

  async function load(quiet) {
    let r;
    try { r = await fetch('/config', { headers: auth }); } catch (e) { return false; }
    const text = await r.text();
    if (!r.ok) { say(text.trim(), 'bad'); return false; }
    render(text);
    if (!quiet) say('');
    return true;
  }

  // After an apply the daemon goes away for a second or two. Knock until it
  // is back, then show the file as it now reads it.
  async function wait() {
    for (let n = 0; n < 40; n++) {
      await new Promise(r => setTimeout(r, 750));
      if (await load(true)) { pending = false; buttons(); say('applied. tea is running your settings', 'good'); return; }
    }
    say('saved, but tea has not come back yet. `systemctl --user status tea` will say why', 'bad');
  }

  // One request does both jobs: the file goes back, and the header says
  // whether tea should restart on it.
  async function send(applying) {
    save.disabled = apply.disabled = true;
    say(applying ? 'applying…' : 'saving…');
    let r, text;
    try {
      const headers = { ...auth, 'Content-Type': 'text/plain; charset=utf-8' };
      if (applying) headers['X-Tea-Apply'] = '1';
      r = await fetch('/config', { method: 'POST', headers, body: compose() });
      text = await r.text();
    } catch (e) { say('tea did not answer', 'bad'); apply.disabled = false; buttons(); return; }
    apply.disabled = false;
    if (!r.ok) { say(text.trim(), 'bad'); buttons(); return; }
    if (applying && /restarting/.test(text)) { await wait(); return; }
    pending = !applying;
    await load(true);
    say(applying ? text.trim() : 'saved. Apply when you are ready', 'good');
  }

  form.addEventListener('submit', ev => { ev.preventDefault(); if (dirty()) send(false); });
  apply.addEventListener('click', () => send(true));
  document.getElementById('undo').addEventListener('click', () => load());
  load();
})();
</script>
</body>
</html>
